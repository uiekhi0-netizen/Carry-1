name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unzip
        run: |
          for i in 1 2; do
            find . -name '*.zip' -not -path './.git/*' -exec unzip -o {} -d . \;
          done
          ls -R | head -50
      - name: Build
        run: |
          POM=$(grep -rl --include=pom.xml "<artifactId>CarryPlugin</artifactId>" . | head -n 1)
          echo "Using $POM"
          mvn -f "$POM" clean package
      - uses: actions/upload-artifact@v4
        with:
          name: CarryPlugin-jar
          path: "**/target/CarryPlugin*.jar"
