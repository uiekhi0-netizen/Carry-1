name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unzip
        run: |
          for i in 1 2; do
            find . -name '*.zip' -not -path './.git/*' -exec unzip -o {} -d . \;
          done
      - name: Build
        run: |
          POM=$(grep -rl --include=pom.xml "<artifactId>CarryPlugin</artifactId>" . | head -n 1)
          echo "Using $POM"
          mvn -f "$POM" clean package
          cp "$(dirname "$POM")/target/CarryPlugin.jar" ./CarryPlugin.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CarryPlugin build ${{ github.run_number }}
          files: CarryPlugin.jar
