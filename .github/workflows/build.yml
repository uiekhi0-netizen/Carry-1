name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unzip
        run: |
          for i in 1 2; do
            find . -name '*.zip' -not -path './.git/*' -exec unzip -o {} -d . \;
          done
      - name: Build
        run: |
          POM=$(grep -rl --include=pom.xml "<artifactId>CarryPlugin</artifactId>" . | head -n 1)
          echo "Using $POM"
          mvn -f "$POM" clean package
          mkdir -p out
          cp "$(dirname "$POM")/target/CarryPlugin.jar" out/CarryPlugin.jar
      - name: Commit jar to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan jar-output
          git rm -rf . > /dev/null 2>&1 || true
          cp out/CarryPlugin.jar ./CarryPlugin.jar
          git add CarryPlugin.jar
          git commit -m "Build CarryPlugin.jar"
          git push -f origin jar-output
